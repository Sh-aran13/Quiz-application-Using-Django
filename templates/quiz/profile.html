{% block extra_css %}
<style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@200;300;400;500;600;700;800;900&family=Playfair+Display:wght@400;500;600;700;800;900&display=swap');
    
    * {
        font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        box-sizing: border-box;
    }
    
    body {
        background: radial-gradient(circle at 0% 0%, #1a1a2e 0, #0f0f23 35%, #020617 100%);
        min-height: 100vh;
        position: relative;
        overflow-x: hidden;
        color: #e2e8f0;
    }
    
    /* New soft gradient wave background */
    .bg-animation {
        position: fixed;
        inset: 0;
        z-index: -1;
        overflow: hidden;
        pointer-events: none;
    }
    
    .gradient-orbit {
        position: absolute;
        width: 140%;
        height: 140%;
        top: -20%;
        left: -20%;
        background:
            radial-gradient(circle at 10% 20%, rgba(129, 140, 248, 0.35), transparent 55%),
            radial-gradient(circle at 80% 0%, rgba(244, 114, 182, 0.4), transparent 55%),
            radial-gradient(circle at 0% 100%, rgba(56, 189, 248, 0.35), transparent 55%),
            radial-gradient(circle at 100% 100%, rgba(248, 250, 252, 0.06), transparent 60%);
        filter: blur(12px);
        animation: orbitGradient 32s ease-in-out infinite alternate;
        transform-origin: 50% 50%;
    }
    
    .gradient-noise-overlay {
        position: absolute;
        inset: 0;
        background-image: radial-gradient(circle at 1px 1px, rgba(15, 23, 42, 0.4) 1px, transparent 0);
        background-size: 3px 3px;
        opacity: 0.35;
        mix-blend-mode: soft-light;
    }
    
    @keyframes orbitGradient {
        0% {
            transform: translate3d(0, 0, 0) scale(1);
        }
        50% {
            transform: translate3d(-30px, 20px, 0) scale(1.05);
        }
        100% {
            transform: translate3d(20px, -30px, 0) scale(1.02);
        }
    }
    
    /* Floating depth circles (different from previous shapes) */
    .depth-circle {
        position: absolute;
        border-radius: 999px;
        border: 1px solid rgba(148, 163, 184, 0.1);
        box-shadow:
            0 0 0 1px rgba(15, 23, 42, 0.8),
            0 25px 60px rgba(15, 23, 42, 0.9);
        backdrop-filter: blur(16px);
        background: radial-gradient(circle at 20% 0%, rgba(148, 163, 184, 0.25), transparent 60%);
        animation: floatCircle 18s ease-in-out infinite;
    }
    
    .depth-circle--left {
        width: 260px;
        height: 260px;
        top: 18%;
        left: -120px;
        animation-delay: 0s;
    }
    
    .depth-circle--right {
        width: 220px;
        height: 220px;
        bottom: 8%;
        right: -100px;
        animation-delay: 4s;
    }
    
    @keyframes floatCircle {
        0% {
            transform: translate3d(0, 0, 0);
            opacity: 0.45;
        }
        50% {
            transform: translate3d(15px, -20px, 0);
            opacity: 0.7;
        }
        100% {
            transform: translate3d(-10px, 15px, 0);
            opacity: 0.5;
        }
    }
    
    /* Typography */
    h1, h2, h3, h4, h5, h6 {
        font-family: 'Playfair Display', serif;
        font-weight: 700;
        line-height: 1.2;
    }
    
    h2 {
        animation: slideDown 0.9s cubic-bezier(0.25, 0.8, 0.25, 1) 0.25s both;
        background: linear-gradient(135deg, #a5b4fc 0%, #f9a8d4 50%, #f97373 100%);
        background-clip: text;
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        text-shadow: 0 10px 40px rgba(15, 23, 42, 0.7);
        font-size: clamp(2rem, 5vw, 3.4rem);
        font-weight: 800;
        letter-spacing: -0.03em;
    }
    
    @keyframes slideDown {
        from {
            transform: translateY(-32px);
            opacity: 0;
        }
        to {
            transform: translateY(0);
            opacity: 1;
        }
    }
    
    /* Main Container */
    .profile-container {
        max-width: 800px;
        margin: 0 auto;
        padding: 2.5rem 1.5rem 3.5rem;
        animation: fadeInUpContainer 1s ease-out 0.35s both;
        position: relative;
    }
    
    @keyframes fadeInUpContainer {
        from {
            transform: translateY(32px);
            opacity: 0;
        }
        to {
            transform: translateY(0);
            opacity: 1;
        }
    }
    
    /* Glassmorphism Card */
    .card {
        background: radial-gradient(circle at top left, rgba(148, 163, 184, 0.16), transparent 60%),
                    rgba(15, 23, 42, 0.85);
        backdrop-filter: blur(30px) saturate(170%);
        -webkit-backdrop-filter: blur(30px) saturate(170%);
        border-radius: 32px;
        padding: 3.2rem 3rem;
        box-shadow:
            0 26px 60px rgba(15, 23, 42, 0.8),
            0 0 0 1px rgba(148, 163, 184, 0.25);
        border: 1px solid rgba(148, 163, 184, 0.28);
        position: relative;
        overflow: hidden;
        transition: transform 0.5s ease, box-shadow 0.5s ease, border-color 0.4s ease;
    }
    
    .card::before {
        content: '';
        position: absolute;
        inset: -40%;
        background: radial-gradient(circle at 0 0, rgba(248, 250, 252, 0.12), transparent 50%);
        opacity: 0;
        transform: translate3d(-40px, -40px, 0);
        transition: opacity 0.6s ease, transform 0.6s ease;
        pointer-events: none;
    }
    
    .card:hover {
        transform: translateY(-6px);
        box-shadow:
            0 32px 80px rgba(15, 23, 42, 0.95),
            0 0 0 1px rgba(165, 180, 252, 0.6);
        border-color: rgba(165, 180, 252, 0.7);
    }
    
    .card:hover::before {
        opacity: 1;
        transform: translate3d(0, 0, 0);
    }
    
    /* Avatar */
    .avatar-container {
        text-align: center;
        margin-bottom: 2.6rem;
        animation: fadeInScale 0.9s cubic-bezier(0.34, 1.56, 0.64, 1) 0.5s both;
    }
    
    @keyframes fadeInScale {
        from {
            transform: scale(0.75);
            opacity: 0;
        }
        to {
            transform: scale(1);
            opacity: 1;
        }
    }
    
    .avatar {
        width: 150px;
        height: 150px;
        border-radius: 999px;
        background: radial-gradient(circle at 30% 0%, #f9a8d4 0, #4f46e5 50%, #0f172a 100%);
        margin: 0 auto;
        display: flex;
        align-items: center;
        justify-content: center;
        color: #f9fafb;
        font-size: 4rem;
        font-weight: 900;
        position: relative;
        box-shadow:
            0 24px 60px rgba(15, 23, 42, 0.9),
            0 0 0 1px rgba(148, 163, 184, 0.5);
        overflow: hidden;
    }
    
    .avatar::before {
        content: '';
        position: absolute;
        inset: -40%;
        background: conic-gradient(from 180deg, rgba(129, 140, 248, 0.2), rgba(248, 250, 252, 0.05), rgba(244, 114, 182, 0.4), rgba(129, 140, 248, 0.2));
        animation: spinHalo 22s linear infinite;
        opacity: 0.75;
    }
    
    .avatar::after {
        content: '';
        position: absolute;
        inset: 8px;
        border-radius: inherit;
        background: radial-gradient(circle at 30% 0%, rgba(248, 250, 252, 0.16), transparent 55%);
        box-shadow: inset 0 0 26px rgba(15, 23, 42, 0.9);
    }
    
    @keyframes spinHalo {
        from { transform: rotate(0deg); }
        to { transform: rotate(360deg); }
    }
    
    .avatar span {
        position: relative;
        z-index: 1;
    }
    
    /* Form Groups */
    .form-group {
        margin-bottom: 1.9rem;
        opacity: 0;
        transform: translateY(16px);
        animation: fieldFadeUp 0.6s ease-out forwards;
        position: relative;
    }
    
    .form-group:nth-of-type(1) { animation-delay: 0.6s; }
    .form-group:nth-of-type(2) { animation-delay: 0.7s; }
    .form-group:nth-of-type(3) { animation-delay: 0.8s; }
    .form-group:nth-of-type(4) { animation-delay: 0.9s; }
    .form-group:nth-of-type(5) { animation-delay: 1.0s; }
    .form-group:nth-of-type(6) { animation-delay: 1.1s; }
    .form-group:nth-of-type(7) { animation-delay: 1.2s; }
    
    @keyframes fieldFadeUp {
        to {
            transform: translateY(0);
            opacity: 1;
        }
    }
    
    .form-group label {
        display: block;
        margin-bottom: 10px;
        color: #e2e8f0;
        font-weight: 600;
        font-size: 0.95rem;
        text-transform: uppercase;
        letter-spacing: 0.14em;
        position: relative;
    }
    
    .form-group label::after {
        content: '';
        position: absolute;
        left: 0;
        bottom: -6px;
        width: 34px;
        height: 2px;
        border-radius: 999px;
        background: linear-gradient(90deg, #a5b4fc, #f9a8d4);
        opacity: 0.8;
    }
    
    .form-group input {
        width: 100%;
        padding: 16px 22px;
        border: 1px solid rgba(148, 163, 184, 0.5);
        border-radius: 18px;
        background: rgba(15, 23, 42, 0.9);
        font-size: 1.02rem;
        color: #f9fafb;
        font-weight: 400;
        transition: border-color 0.25s ease, box-shadow 0.25s ease, background 0.25s ease, transform 0.18s ease;
        box-shadow:
            0 10px 30px rgba(15, 23, 42, 0.9),
            inset 0 0 0 1px rgba(15, 23, 42, 0.9);
    }
    
    .form-group input:focus {
        outline: none;
        border-color: #a5b4fc;
        background: radial-gradient(circle at 0 0, rgba(148, 163, 184, 0.2), #020617);
        transform: translateY(-2px);
        box-shadow:
            0 18px 40px rgba(30, 64, 175, 0.55),
            0 0 0 1px rgba(129, 140, 248, 0.6);
    }
    
    /* Role Badge */
    .role-badge {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        padding: 10px 26px;
        border-radius: 999px;
        background: linear-gradient(135deg, #4f46e5 0%, #6366f1 35%, #f472b6 100%);
        color: #f9fafb;
        font-weight: 700;
        font-size: 0.9rem;
        text-transform: uppercase;
        letter-spacing: 0.16em;
        box-shadow:
            0 14px 35px rgba(99, 102, 241, 0.5),
            0 0 0 1px rgba(248, 250, 252, 0.06);
        position: relative;
        overflow: hidden;
    }
    
    .role-badge::after {
        content: '';
        position: absolute;
        inset: 0;
        background: linear-gradient(120deg, transparent 0, rgba(255, 255, 255, 0.35) 40%, transparent 70%);
        transform: translateX(-120%);
        transition: transform 0.7s ease;
    }
    
    .form-group:hover .role-badge::after {
        transform: translateX(120%);
    }
    
    /* Button */
    .btn-container {
        text-align: center;
        margin-top: 3rem;
        animation: fadeInUpButton 0.7s ease-out 1.25s both;
    }
    
    @keyframes fadeInUpButton {
        from {
            transform: translateY(20px);
            opacity: 0;
        }
        to {
            transform: translateY(0);
            opacity: 1;
        }
    }
    
    .btn {
        position: relative;
        padding: 16px 52px;
        font-size: 0.98rem;
        font-weight: 700;
        border: none;
        border-radius: 999px;
        background: radial-gradient(circle at 0 0, #f97373, #4f46e5);
        color: #f9fafb;
        text-transform: uppercase;
        letter-spacing: 0.22em;
        cursor: pointer;
        overflow: hidden;
        transition: transform 0.22s ease, box-shadow 0.25s ease, background 0.25s ease;
        box-shadow:
            0 18px 45px rgba(15, 23, 42, 0.95),
            0 0 0 1px rgba(248, 250, 252, 0.08);
        text-decoration: none;
        display: inline-flex;
        align-items: center;
        gap: 10px;
    }
    
    .btn span {
        position: relative;
        z-index: 1;
    }
    
    .btn::before {
        content: '←';
        font-size: 1.2rem;
        position: relative;
        z-index: 1;
        transition: transform 0.2s ease;
    }
    
    .btn::after {
        content: '';
        position: absolute;
        inset: 0;
        background: radial-gradient(circle at 0 0, rgba(248, 250, 252, 0.4), transparent 55%);
        opacity: 0;
        transform: translate3d(-40%, -40%, 0) scale(0.8);
        transition: opacity 0.35s ease, transform 0.35s ease;
    }
    
    .btn:hover {
        transform: translateY(-3px);
        box-shadow:
            0 24px 55px rgba(15, 23, 42, 1),
            0 0 0 1px rgba(248, 250, 252, 0.12);
    }
    
    .btn:hover::before {
        transform: translateX(-4px);
    }
    
    .btn:hover::after {
        opacity: 1;
        transform: translate3d(0, 0, 0) scale(1);
    }
    
    .btn:active {
        transform: translateY(-1px) scale(0.98);
        box-shadow:
            0 14px 35px rgba(15, 23, 42, 0.9),
            0 0 0 1px rgba(248, 250, 252, 0.1);
    }
    
    /* Responsive */
    @media (max-width: 768px) {
        .profile-container {
            padding: 2rem 1.25rem 3rem;
        }
        
        .card {
            padding: 2.5rem 2.1rem;
        }
        
        .avatar {
            width: 130px;
            height: 130px;
            font-size: 3.2rem;
        }
        
        h2 {
            margin-bottom: 2.5rem;
            font-size: 2.1rem;
        }
        
        .btn {
            width: 100%;
            justify-content: center;
        }
    }
    
    @media (max-width: 480px) {
        .card {
            padding: 2.2rem 1.6rem;
        }
        
        .avatar {
            width: 115px;
            height: 115px;
            font-size: 2.8rem;
        }
    }
</style>
{% endblock %}

{% block content %}
<div class="bg-animation">
    <div class="gradient-orbit"></div>
    <div class="gradient-noise-overlay"></div>
    <div class="depth-circle depth-circle--left"></div>
    <div class="depth-circle depth-circle--right"></div>
</div>

<div class="profile-container">
    <h2 style="text-align: center; margin-bottom: 3.5rem;">👤 User Profile</h2>
    
    <div class="card">
        <div class="avatar-container">
            <div class="avatar">
                <span>{{ user.username|first|upper }}</span>
            </div>
        </div>
        
        <div class="form-group">
            <label>👤 Username</label>
            <input type="text" value="{{ user.username }}" readonly>
        </div>
        
        <div class="form-group">
            <label>✉️ Email</label>
            <input type="email" value="{{ user.email }}" readonly>
        </div>
        
        <div class="form-group">
            <label>📱 Phone</label>
            <input type="text" value="{{ user.phone }}" readonly>
        </div>
        
        <div class="form-group">
            <label>🎭 Role</label>
            <div style="margin-top: 12px;">
                <span class="role-badge">{{ user.get_role_display }}</span>
            </div>
        </div>
        
        {% if user.role == 'student' %}
        <div class="form-group">
            <label>🎓 Roll Number</label>
            <input type="text" value="{{ user.roll_number }}" readonly>
        </div>
        
        <div class="form-group">
            <label>🏫 Branch</label>
            <input type="text" value="{{ user.branch }}" readonly>
        </div>
        {% endif %}
        
        <div class="form-group">
            <label>📅 Member Since</label>
            <input type="text" value="{{ user.date_joined|date:'F d, Y' }}" readonly>
        </div>
        
        <div class="btn-container">
            <a href="{% if user.role == 'admin' or user.is_superuser %}{% url 'admin_dashboard' %}{% else %}{% url 'student_dashboard' %}{% endif %}" class="btn">
                <span>Back to Dashboard</span>
            </a>
        </div>
    </div>
</div>
{% endblock %}
