{% block extra_css %}
<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Playfair+Display:wght@500;600;700&display=swap');

/* ===== Reset & Base ===== */
*,
*::before,
*::after {
  box-sizing: border-box;
}

html, body {
  height: 100%;
}

body {
  margin: 0;
  font-family: 'Inter', system-ui, -apple-system, BlinkMacSystemFont, sans-serif;
  color: #e5e7eb;
  background:
    radial-gradient(circle at 0% 0%, #1d293b 0, #020617 45%, #020617 100%);
  overflow-x: hidden;
}

/* ===== Background Orbits ===== */
.page-shell {
  min-height: 100vh;
  padding: 32px 16px 40px;
  display: flex;
  align-items: center;
  justify-content: center;
  position: relative;
  isolation: isolate;
}

.bg-layer {
  position: fixed;
  inset: -20%;
  z-index: -3;
  background:
    radial-gradient(circle at 0% 0%, rgba(56,189,248,0.16), transparent 55%),
    radial-gradient(circle at 100% 10%, rgba(129,140,248,0.2), transparent 55%),
    radial-gradient(circle at 10% 100%, rgba(248,113,113,0.18), transparent 55%);
}

.bg-orb {
  position: fixed;
  border-radius: 999px;
  filter: blur(52px);
  opacity: 0.7;
  mix-blend-mode: screen;
  z-index: -2;
  transform-origin: center;
  animation: orbFloat 26s ease-in-out infinite alternate;
}

.bg-orb.orb-1 {
  width: 260px;
  height: 260px;
  left: -60px;
  top: 4%;
  background: conic-gradient(from 180deg, rgba(56,189,248,0.6), rgba(56,189,248,0));
}

.bg-orb.orb-2 {
  width: 260px;
  height: 260px;
  right: -40px;
  bottom: 8%;
  background: conic-gradient(from 0deg, rgba(139,92,246,0.6), rgba(139,92,246,0));
  animation-delay: 6s;
}

.bg-orb.orb-3 {
  width: 220px;
  height: 220px;
  left: 40%;
  top: 60%;
  background: conic-gradient(from 90deg, rgba(248,113,113,0.55), rgba(248,113,113,0));
  animation-delay: 11s;
}

@keyframes orbFloat {
  0%   { transform: translate3d(0, 0, 0) scale(1); }
  50%  { transform: translate3d(18px, -26px, 0) scale(1.06); }
  100% { transform: translate3d(-16px, 18px, 0) scale(0.98); }
}

/* ===== Centered Layout ===== */
.quiz-wrapper {
  width: 100%;
  max-width: 960px;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
}

/* Title centered above card */
.quiz-title {
  font-family: 'Playfair Display', serif;
  font-size: clamp(2.2rem, 3vw, 2.6rem);
  font-weight: 700;
  letter-spacing: 0.03em;
  color: #f9fafb;
  margin: 0 0 18px 0;
  text-shadow: 0 18px 45px rgba(15,23,42,0.9);
  animation: titlePop 0.8s cubic-bezier(0.23,1,0.32,1) 60ms both;
}

/* ===== Glass Card Form (centered) ===== */
.quiz-card {
  width: 100%;
  max-width: 520px;
  background:
    radial-gradient(circle at top left, rgba(129,140,248,0.26), transparent 55%),
    linear-gradient(145deg, rgba(15,23,42,0.96), rgba(15,23,42,0.98));
  border-radius: 28px;
  padding: 28px 26px 26px;
  border: 1px solid rgba(148,163,184,0.6);
  box-shadow:
    0 24px 70px rgba(15,23,42,0.96),
    0 0 0 1px rgba(15,23,42,0.9);
  backdrop-filter: blur(18px);
  -webkit-backdrop-filter: blur(18px);
  position: relative;
  overflow: hidden;
  animation: cardReveal 0.9s cubic-bezier(0.19,1,0.22,1) 140ms both;
}

.quiz-card::before {
  content: '';
  position: absolute;
  inset: -1px;
  background:
    linear-gradient(120deg, rgba(56,189,248,0.24), transparent 45%, rgba(147,197,253,0.26), transparent 75%);
  mix-blend-mode: soft-light;
  opacity: 0.8;
  pointer-events: none;
}

.quiz-form {
  margin-top: 4px;
}

/* AI Description Generator Styles */
.ai-generator-container {
  display: flex;
  gap: 10px;
  margin-top: 8px;
  flex-wrap: wrap;
  align-items: center;
}

.ai-generate-btn {
  background: linear-gradient(135deg, #3b82f6, #1d4ed8);
  color: white;
  border: none;
  border-radius: 8px;
  padding: 8px 12px;
  font-size: 0.8rem;
  font-weight: 600;
  cursor: pointer;
  display: inline-flex;
  align-items: center;
  gap: 6px;
  transition: all 0.2s ease;
}

.ai-generate-btn:hover {
  transform: translateY(-1px);
  box-shadow: 0 4px 12px rgba(59, 130, 246, 0.4);
}

.ai-generate-btn:disabled {
  opacity: 0.7;
  cursor: not-allowed;
  transform: none;
  box-shadow: none;
}

.ai-loading {
  display: none;
  width: 16px;
  height: 16px;
  border: 2px solid rgba(255, 255, 255, 0.3);
  border-top: 2px solid white;
  border-radius: 50%;
  animation: spin 1s linear infinite;
}

@keyframes spin {
  0% { transform: rotate(0deg); }
  100% { transform: rotate(360deg); }
}

/* Toast Notification Styles */
.toast-container {
  position: fixed;
  top: 20px;
  right: 20px;
  z-index: 9999;
  display: flex;
  flex-direction: column;
  gap: 10px;
  align-items: flex-end;
}

.toast {
  background: linear-gradient(135deg, rgba(15, 23, 42, 0.95), rgba(30, 41, 59, 0.95));
  backdrop-filter: blur(10px);
  -webkit-backdrop-filter: blur(10px);
  border: 1px solid rgba(148, 163, 184, 0.3);
  border-radius: 12px;
  padding: 14px 18px;
  min-width: 280px;
  max-width: 350px;
  box-shadow: 0 10px 25px rgba(0, 0, 0, 0.3);
  display: flex;
  align-items: center;
  gap: 12px;
  transform: translateX(120%);
  transition: transform 0.3s ease-out;
  opacity: 0;
  animation: slideIn 0.3s ease-out forwards;
}

.toast.show {
  transform: translateX(0);
  opacity: 1;
}

.toast.error {
  border-left: 4px solid #ef4444;
}

.toast.warning {
  border-left: 4px solid #f59e0b;
}

.toast.success {
  border-left: 4px solid #10b981;
}

.toast-icon {
  font-size: 1.2rem;
}

.toast-message {
  flex: 1;
  font-size: 0.9rem;
  color: #e2e8f0;
}

@keyframes slideIn {
  0% {
    transform: translateX(120%);
    opacity: 0;
  }
  100% {
    transform: translateX(0);
    opacity: 1;
  }
}

@keyframes slideOut {
  0% {
    transform: translateX(0);
    opacity: 1;
  }
  100% {
    transform: translateX(120%);
    opacity: 0;
  }
}
/* ===== Form Fields ===== */
.field-group {
  margin-bottom: 22px;
  opacity: 0;
  animation: fieldIn 0.6s cubic-bezier(0.34,1.56,0.64,1) forwards;
}

.field-group:nth-child(1) { animation-delay: 0.18s; }
.field-group:nth-child(2) { animation-delay: 0.26s; }
.field-group:nth-child(3) { animation-delay: 0.34s; }
.field-group:nth-child(4) { animation-delay: 0.42s; }
.field-group:nth-child(5) { animation-delay: 0.5s; }

.field-label {
  display: flex;
  align-items: center;
  gap: 8px;
  margin-bottom: 8px;
  font-size: 0.85rem;
  font-weight: 600;
  text-transform: uppercase;
  letter-spacing: 0.12em;
  color: #cbd5f5;
}

.field-label-icon {
  width: 18px;
  height: 18px;
  border-radius: 999px;
  background: radial-gradient(circle at 30% 30%, #6366f1, #0ea5e9);
  display: inline-flex;
  align-items: center;
  justify-content: center;
  font-size: 0.75rem;
  color: #e5e7eb;
}

/* Inputs & textarea */
.field-group input[type="text"],
.field-group input[type="number"],
.field-group textarea {
  width: 100%;
  padding: 13px 14px 13px 15px;
  border-radius: 14px;
  border: 1px solid rgba(51,65,85,0.8);
  background: radial-gradient(circle at 0 0, rgba(15,23,42,0.96), rgba(15,23,42,0.98));
  color: #e5e7eb;
  font-size: 0.95rem;
  outline: none;
  box-shadow: 0 10px 24px rgba(15,23,42,0.96);
  transition:
    border-color 0.2s ease-out,
    box-shadow 0.2s ease-out,
    transform 0.16s ease-out,
    background-color 0.2s ease-out;
}

.field-group textarea {
  min-height: 120px;
  resize: vertical;
}

.field-group input::placeholder,
.field-group textarea::placeholder {
  color: #6b7280;
}

.field-group input:focus,
.field-group textarea:focus {
  border-color: rgba(129,140,248,0.9);
  box-shadow:
    0 16px 40px rgba(15,23,42,0.98),
    0 0 0 1px rgba(59,130,246,0.75);
  transform: translateY(-1px);
}

/* ===== Active checkbox row ===== */
.active-row {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 10px 12px;
  border-radius: 16px;
  border: 1px solid rgba(55,65,81,0.9);
  background: linear-gradient(135deg, rgba(22,101,52,0.25), rgba(15,23,42,0.98));
  box-shadow: 0 12px 30px rgba(15,23,42,0.96);
  transition:
    border-color 0.18s ease-out,
    box-shadow 0.18s ease-out,
    transform 0.16s ease-out;
}

.active-row:hover {
  border-color: rgba(34,197,94,0.9);
  transform: translateY(-1px);
  box-shadow: 0 16px 40px rgba(15,23,42,1);
}

.active-row input[type="checkbox"] {
  width: 20px;
  height: 20px;
  accent-color: #22c55e;
  cursor: pointer;
}

.active-text-main {
  font-size: 0.9rem;
  font-weight: 600;
  color: #e5e7eb;
}

.active-text-sub {
  font-size: 0.78rem;
  color: #a3e635;
}

/* ===== Alert for form errors ===== */
.alert {
  margin-top: 10px;
  margin-bottom: 16px;
  padding: 12px 14px;
  border-radius: 14px;
  border-left: 3px solid #ef4444;
  background: linear-gradient(135deg, rgba(248,113,113,0.2), rgba(127,29,29,0.8));
  color: #fee2e2;
  font-size: 0.8rem;
  animation: alertSlide 0.45s ease-out both;
  white-space: pre-wrap;
}

/* ===== Buttons ===== */
.button-row {
  display: flex;
  flex-wrap: wrap;
  gap: 10px;
  margin-top: 18px;
  animation: buttonReveal 0.7s ease-out 0.7s both;
}

.btn {
  position: relative;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  padding: 12px 26px;
  border-radius: 999px;
  border: 0;
  cursor: pointer;
  font-size: 0.9rem;
  font-weight: 700;
  letter-spacing: 0.13em;
  text-transform: uppercase;
  text-decoration: none;
  overflow: hidden;
  outline: none;
  transition:
    transform 0.18s cubic-bezier(0.34,1.56,0.64,1),
    box-shadow 0.18s ease-out,
    opacity 0.15s ease-out;
}

.btn::before {
  content: '';
  position: absolute;
  top: 50%;
  left: 50%;
  width: 0;
  height: 0;
  border-radius: 999px;
  background: rgba(248,250,252,0.4);
  transform: translate(-50%, -50%);
  transition: width 0.55s, height 0.55s;
}

.btn:hover::before {
  width: 520px;
  height: 520px;
}

.btn:hover {
  transform: translateY(-2px) scale(1.02);
}

.btn:active {
  transform: translateY(0) scale(0.98);
}

.btn-primary {
  background: linear-gradient(135deg, #22c55e, #16a34a);
  color: #f9fafb;
  box-shadow: 0 18px 40px rgba(22,163,74,0.6);
}

.btn-secondary {
  background: linear-gradient(135deg, #4b5563, #020617);
  color: #e5e7eb;
  box-shadow: 0 18px 32px rgba(15,23,42,0.9);
}

.btn-icon {
  font-size: 1rem;
}

/* ===== Animations ===== */
@keyframes titlePop {
  from { opacity: 0; transform: translateY(-14px) scale(0.97); }
  70%  { opacity: 1; transform: translateY(2px) scale(1.02); }
  to   { opacity: 1; transform: translateY(0) scale(1); }
}

@keyframes cardReveal {
  from { opacity: 0; transform: translateY(18px) scale(0.98); }
  to   { opacity: 1; transform: translateY(0) scale(1); }
}

@keyframes fieldIn {
  from { opacity: 0; transform: translateX(-18px); }
  to   { opacity: 1; transform: translateX(0); }
}

@keyframes alertSlide {
  from { opacity: 0; transform: translateY(-12px); }
  to   { opacity: 1; transform: translateY(0); }
}

@keyframes buttonReveal {
  from { opacity: 0; transform: translateY(18px); }
  to   { opacity: 1; transform: translateY(0); }
}

/* ===== Responsive tweaks ===== */
@media (max-width: 640px) {
  .page-shell {
    padding-inline: 14px;
  }

  .quiz-card {
    padding: 22px 18px 20px;
  }

  .button-row {
    flex-direction: column;
  }

  .btn {
    width: 100%;
    justify-content: center;
  }
}
</style>
<script>
// Function to create and show toast notifications
function showToast(type, message) {
  const toastContainer = document.getElementById('toast-container');
  
  // Create toast element
  const toast = document.createElement('div');
  toast.className = `toast ${type}`;
  
  // Create icon based on type
  const icon = document.createElement('div');
  icon.className = 'toast-icon';
  
  switch(type) {
    case 'success':
      icon.innerHTML = '✅';
      break;
    case 'error':
      icon.innerHTML = '❌';
      break;
    case 'warning':
      icon.innerHTML = '⚠️';
      break;
    default:
      icon.innerHTML = 'ℹ️';
  }
  
  // Create message element
  const toastMessage = document.createElement('div');
  toastMessage.className = 'toast-message';
  toastMessage.textContent = message;
  
  // Add elements to toast
  toast.appendChild(icon);
  toast.appendChild(toastMessage);
  
  // Add toast to container
  toastContainer.appendChild(toast);
  
  // Trigger show animation
  setTimeout(() => {
    toast.classList.add('show');
  }, 10);
  
  // Auto remove toast after delay
  setTimeout(() => {
    toast.style.animation = 'slideOut 0.3s ease-in forwards';
    setTimeout(() => {
      toast.remove();
    }, 300);
  }, 4000); // Show for 4 seconds
}

document.addEventListener('DOMContentLoaded', function() {
  const generateBtn = document.getElementById('generate-description');
  const titleInput = document.querySelector('input[name="title"]');
  const descriptionTextarea = document.querySelector('textarea[name="description"]');
  const loadingIndicator = document.getElementById('ai-loading');
  const buttonText = document.querySelector('.ai-text');
  
  if (generateBtn && titleInput && descriptionTextarea) {
    generateBtn.addEventListener('click', async function() {
      const title = titleInput.value.trim();
      
      if (!title) {
        showToast('warning', 'Please enter a quiz title first.');
        return;
      }
      
      // Show loading state
      generateBtn.disabled = true;
      loadingIndicator.style.display = 'inline-block';
      buttonText.textContent = 'Generating...';
      
      try {
        // Call the AI description generation API (let backend choose service)
        const response = await fetch('{% url "generate_quiz_description" %}', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/x-www-form-urlencoded',
            'X-CSRFToken': document.querySelector('[name=csrfmiddlewaretoken]').value
          },
          body: new URLSearchParams({
            'title': title
          })
        });
        
        const data = await response.json();
        
        if (response.ok) {
          descriptionTextarea.value = data.description;
        } else {
          throw new Error(data.error || 'Failed to generate description');
        }
      } catch (error) {
        console.error('Error generating description:', error);
        showToast('error', 'Failed to generate description. Please try again.');
      } finally {
        // Reset button state
        generateBtn.disabled = false;
        loadingIndicator.style.display = 'none';
        buttonText.textContent = 'Generate with AI';
      }
    });
  }
});
</script>
{% endblock %}
{% block content %}
<div class="bg-layer"></div>
<div class="bg-orb orb-1"></div>
<div class="bg-orb orb-2"></div>
<div class="bg-orb orb-3"></div>

<!-- Toast Container -->
<div class="toast-container" id="toast-container"></div>

<div class="page-shell">
  <div class="quiz-wrapper">

    <!-- Centered title above container -->
    <h1 class="quiz-title">Create quiz</h1>

    <!-- Centered glass form card -->
    <section class="quiz-card">
      <form method="post" class="quiz-form">
        {% csrf_token %}

        <div class="field-group">
          <div class="field-label">
            <span class="field-label-icon">✏️</span>
            <span>Quiz title</span>
          </div>
          {{ form.title }}
        </div>

        <div class="field-group">
          <div class="field-label">
            <span class="field-label-icon">💬</span>
            <span>Description</span>
          </div>
          {{ form.description }}
          <div class="ai-generator-container">
            <button type="button" id="generate-description" class="ai-generate-btn">
              <span class="ai-loading" id="ai-loading"></span>
              <span class="ai-text">Generate with AI</span>
            </button>
          </div>
        </div>
        <div class="field-group">
          <div class="field-label">
            <span class="field-label-icon">⏱️</span>
            <span>Time limit (minutes)</span>
          </div>
          {{ form.time_limit }}
        </div>

        <div class="field-group">
          <label class="active-row">
            {{ form.is_active }}
            <div>
              <div class="active-text-main">Activate quiz immediately</div>
              <div class="active-text-sub">Students can see and attempt the quiz as soon as it is created.</div>
            </div>
          </label>
        </div>

        {% if form.errors %}
        <div class="field-group">
          <div class="alert">
            {{ form.errors }}
          </div>
        </div>
        {% endif %}

        <div class="button-row">
          <button type="submit" class="btn btn-primary">
            <span class="btn-icon">✅</span>
            <span>Create quiz</span>
          </button>
          <a href="{% url 'admin_dashboard' %}" class="btn btn-secondary">
            <span class="btn-icon">✕</span>
            <span>Cancel</span>
          </a>
        </div>
      </form>
    </section>
  </div>
</div>
{% endblock %}
